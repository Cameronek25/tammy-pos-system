<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tammy’s Bar &amp; Grille | Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --surface: #ffffff;
      --text: #1e1e1e;
      --muted: #8f887f;
      --border: #e5ded4;
      --accent: #6a5e99;
      --accent-soft: #dfe7f5;
      --shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
      --open: #efe9df;
      --submitted: #e3ecf9;
      --inkitchen: #f5e7c5;
      --ready: #e4f3e6;
      --delivered: #ececec;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
  height: 100%;
}

body {
   margin: 0;
  padding: 28px;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(to bottom, #f4f6f9, #ebeff2);
  color: var(--text);
  min-height: 100vh; 
}

.page {
  max-width: 1240px;
  margin: 0 auto;

  flex: 1; 
  display: flex;
  flex-direction: column;
}

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border-radius: 16px;
      margin-bottom: 28px;
      background: var(--accent-soft);
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .employee-text {
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
    }

    .logout-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .logout-btn:hover {
      background: #eef3ff;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 34px;
    }

    .action-card {
      min-height: 86px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.18s ease;
    }

    .action-card:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .action-card.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .action-icon {
      font-size: 15px;
      opacity: 0.75;
    }

    .section-header {
      margin-bottom: 20px;
    }

    .section-header h2 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .section-header p {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      font-weight: 500;
    }

    .tables-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--shadow);
      transition: all 0.18s ease;
      display: block;
    }

    .table-card:hover {
      transform: translateY(-2px);
    }

    .table-card.open {
      background: var(--open);
    }

    .table-card.submitted {
      background: var(--submitted);
    }

    .table-card.inkitchen {
      background: var(--inkitchen);
    }

    .table-card.ready {
      background: var(--ready);
    }

    .table-card.delivered {
      background: var(--delivered);
    }

    .table-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .table-number {
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
    }

    .status-badge {
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255,255,255,0.7);
    }

    .table-meta {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
    }

    .empty-state {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 36px 24px;
      text-align: center;
      color: var(--muted);
      box-shadow: var(--shadow);
    }

    @media (max-width: 1000px) {
      .actions,
      .tables-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 20px;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .topbar-right {
        width: 100%;
        justify-content: space-between;
      }

      .actions,
      .tables-grid {
        grid-template-columns: 1fr;
      }

      .brand {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">Tammy’s Bar &amp; Grille</div>

      <div class="topbar-right">
        <span class="employee-text">
          <span id="welcomeName">—</span> • <strong id="welcomeRole">—</strong>
        </span>
        <button type="button" class="logout-btn" onclick="logout()">Log Out</button>
      </div>
    </div>

   <div class="actions">
  <a href="./dashboard.html" class="action-card active">
    <span>Dashboard</span>
  </a>

  <a href="./create-order.html" class="action-card">
    <span>Start Table</span>
  </a>

  <a href="./kitchen-queue.html" class="action-card">
    <span>Kitchen Queue</span>
  </a>

  <a href="./manager.html" class="action-card" id="managerNav">
    <span>Manager View</span>
  </a>
</div>

    <div class="section-header">
      <h2 id="dashboardTitle">My Tables</h2>
      <p id="dashboardSubtitle">View and manage active tables.</p>
    </div>

    <div class="tables-grid" id="tablesGrid"></div>
  </div>

  <script src="./script.js"></script>
  <script>
    function getStatusClass(status) {
      const normalized = String(status || "Open").toLowerCase().replace(/\s+/g, "");

      if (normalized === "submitted") return "submitted";
      if (normalized === "inkitchen") return "inkitchen";
      if (normalized === "ready") return "ready";
      if (normalized === "delivered") return "delivered";
      return "open";
    }

    function renderDashboardTables() {
      const empId = requireLogin();
      if (!empId) return;

      const employee = populateSessionHeader();
      if (!employee) return;

      const title = document.getElementById("dashboardTitle");
      const subtitle = document.getElementById("dashboardSubtitle");
      const grid = document.getElementById("tablesGrid");

      const tables = isManager() ? getActiveTables() : getServerTables(empId);

      if (title) {
        title.textContent = isManager() ? "Restaurant Overview" : "My Tables";
      }

      if (subtitle) {
        subtitle.textContent = isManager()
          ? "Monitor all active tables and assigned servers."
          : "View and manage your active tables.";
      }

      if (!tables.length) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <h3 style="margin-top:0; color:#1e1e1e;">No active tables</h3>
            <p style="margin-bottom:18px;">Start a new table to begin service.</p>
            <a href="./create-order.html" class="action-card" style="display:inline-flex; min-height:auto; padding:14px 18px;">
              <span class="action-icon">＋</span>
              <span>Start Table</span>
            </a>
          </div>
        `;
        return;
      }

      grid.innerHTML = tables.map(table => {
        const latestOrder = getLatestOrderForTable(table.tableNumber);
        const status = latestOrder ? latestOrder.status : (table.status || "Open");
        const statusClass = getStatusClass(status);

        const metaLine = isManager()
          ? `Server: ${table.employeeName || table.employeeId || "Unassigned"}`
          : `Guests: ${table.guests || "—"}`;

        const detailLine = latestOrder
          ? `${latestOrder.items.length} item(s) • ${latestOrder.createdAt || ""}`
          : `No submitted order yet`;

        return `
          <a href="./order-entry.html" class="table-card ${statusClass}">
            <div class="table-top">
              <div class="table-number">Table ${table.tableNumber}</div>
              <div class="status-badge">${status}</div>
            </div>

            <div class="table-meta">${metaLine}</div>
            <div class="table-meta">${detailLine}</div>
          </a>
        `;
      }).join("");
    }

    document.addEventListener("DOMContentLoaded", function () {
      renderDashboardTables();
    });
  </script>
</body>
</html>
